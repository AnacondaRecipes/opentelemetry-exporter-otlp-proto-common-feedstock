{% set name = "opentelemetry-exporter-otlp-proto-common" %}
{% set version = "1.45.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: f1f2806f3f28ce7938033823e50934fcd91595a39de38e69a28a51e19f40fc6d

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation  # [not win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-compile  # [win]
  skip: true  # [py<310]
  # Skip compiling byte code to avoid extremely long paths in the conda package cache
  # Due to the nested structure of this package and the long build string, environments
  # can exceed the Windows path limit if installed into LOCALAPPDATA
  skip_compile_pyc:  # [win]
    - "*"            # [win]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - opentelemetry-proto =={{ version }}

# E   ModuleNotFoundError: No module named 'opentelemetry.test'
# https://pypi.org/project/opentelemetry-test-utils, not in the main channel.
{% set ignore_tests = " --ignore=tests/test_metrics_encoder.py" %}

test:
  source_files:
    - tests
  imports:
    - opentelemetry.exporter.otlp.proto.common
  commands:
    - pip check
    - pytest -vv tests {{ ignore_tests }}
  requires:
    - pip
    - pytest >=7.4.4
    - opentelemetry-api =={{ version }}
    - opentelemetry-sdk =={{ version }}
    - opentelemetry-semantic-conventions ==0.66b2

about:
  home: https://opentelemetry.io
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: OpenTelemetry Protobuf encoding
  description: This library is provided as a convenience to encode to Protobuf. 
  doc_url: https://opentelemetry.io/docs
  dev_url: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-common

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
